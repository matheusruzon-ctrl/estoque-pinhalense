var cv="dashboard",ct="dashboard",eii=null,eci=null,ti="box",tc=CL[0],searchVal="";
function uid(){return"id"+Date.now()+Math.random().toString(36).substr(2,5)}
function gc(id){return state.categories.find(function(c){return c.id===id})}
function ibc(cid){return state.items.filter(function(i){return i.categoryId===cid})}
function st(it){if(it.qty<=0)return"out";if(it.minQty&&it.qty<=it.minQty)return"low";return"ok"}
function fd(ts){var d=new Date(ts),n=Date.now(),df=Math.floor((n-ts)/86400000);if(df===0)return"Hoje";if(df===1)return"Ontem";if(df<7)return df+" dias atras";return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"})}

function ui2(n){return n.split(" ").map(function(w){return w[0]}).join("").substring(0,2).toUpperCase()}
function ruser(){if(!state.currentUser){toast("Selecione um usuario");return false}return true}
function showSheet(html){var o=document.getElementById("overlay"),s=document.getElementById("sheet");s.innerHTML=html;o.classList.add("show");requestAnimationFrame(function(){s.classList.add("show")})}

function renderStock(el){

function saveItem(){
var n=document.getElementById("fn").value.trim();

var d={name:n,categoryId:document.getElementById("fc").value,unit:document.getElementById("fu").value.trim()||"un",qty:parseInt(document.getElementById("fq").value)||0,minQty:parseInt(document.getElementById("fm").value)||0,location:document.getElementById("fl").value.trim(),notes:document.getElementById("fo").value.trim(),updated:Date.now()};

function openQtyModal(id,type){
if(!ruser())return;
var it=state.items.find(function(i){return i.id===id});
if(!it)return;
var tl=type==="in"?"Entrada":"Saida";
showSheet('<div class="shh"></div><div class="sht">'+tl+' de Material</div><div class="shs">'+it.name+' - Saldo: '+it.qty+' '+(it.unit||"un")+'</div><div class="qtt"><button class="qtb in'+(type==="in"?" active":"")+'" data-act="openqty" data-val="'+id+'" data-type="in">'+I.arrowUp+'Entrada</button><button class="qtb out'+(type==="out"?" active":"")+'" data-act="openqty" data-val="'+id+'" data-type="out">'+I.arrowDown+'Saida</button></div><div style="text-align:center;margin-bottom:10px"><div class="qc" id="qcDisp">1</div></div><div class="qk"><button class="qkb" data-act="setq" data-val="1">1</button><button class="qkb" data-act="setq" data-val="2">2</button><button class="qkb" data-act="setq" data-val="5">5</button><button class="qkb" data-act="setq" data-val="10">10</button><button class="qkb" data-act="setq" data-val="20">20</button><button class="qkb" data-act="setq" data-val="50">50</button></div><div class="fg"><label class="fl">Quantidade</label><input type="number" class="fi" id="qc" value="1" min="1" oninput="document.getElementById(\'qcDisp\').textContent=this.value"></div><div class="fg"><label class="fl">Motivo</label><input type="text" class="fi" id="qr" placeholder="'+(type==="in"?"Ex: Compra, Doacao":"Ex: Uso, Perda")+'"></div><div class="fa"><button class="btn bs" data-act="close">Cancelar</button><button class="btn bp" data-act="confirmqty" data-val="'+id+'" data-type="'+type+'">Confirmar</button></div>');
}
function setQ(q){if(document.getElementById("qc"))document.getElementById("qc").value=q;if(document.getElementById("qcDisp"))document.getElementById("qcDisp").textContent=q}
function confirmQty(id,type){
var q=parseInt(document.getElementById("qc").value)||0;
if(q<=0){toast("Quantidade invalida");return}
var it=state.items.find(function(i){return i.id===id});
if(!it)return;
var r=document.getElementById("qr").value.trim()||(type==="in"?"Entrada manual":"Saida manual");
if(type==="out"&&q>it.qty){toast("Quantidade superior ao estoque");return}
it.qty+=type==="in"?q:-q;
it.updated=Date.now();
state.movements.push({id:uid(),itemId:id,type:type,qty:q,reason:r,user:state.currentUser,date:Date.now()});
save();closeSheet();render();
toast((type==="in"?"+":"-")+q+" "+(it.unit||"un")+" - "+it.name);
}

if(!it)return;
var movs=state.movements.filter(function(m){return m.itemId===id}).sort(function(a,b){return b.date-a.date});
var h='<div class="shh"></div><div class="sht">Historico</div><div class="shs">'+it.name+'</div>';
if(movs.length===0){h+='<div class="es">'+I.history+'<h3>Sem movimentacoes</h3></div>'}
else{
h+='<div class="ml">';
movs.forEach(function(m){

h+='<div class="mli"><div class="mla" style="background:'+(isIn?"var(--o)":"var(--d)")+'">'+(isIn?I.arrowUp:I.arrowDown)+'</div><div class="mlc"><div class="mln">'+(isIn?"+":"-")+m.qty+' '+(it.unit||"un")+'</div><div class="mlm">'+m.reason+' - '+(m.user||"-")+'</div></div><div class="mld">'+fd(m.date)+'</div></div>';

function deleteCategory(id){showSheet('<div class="shh"></div><div class="sht">Excluir Categoria</div><div class="shs">Itens serao removidos tambem</div><div class="fa"><button class="btn bs" data-act="close">Cancelar</button><button class="btn bd" style="flex:1" data-act="confirmdeletecategory" data-val="'+id+'">Excluir</button></div>')}
function confirmDeleteCategory(id){state.categories=state.categories.filter(function(c){return c.id!==id});state.items=state.items.filter(function(i){return i.categoryId!==id});save();closeSheet();render();toast("Categoria excluida")}
function openSettings(){showSheet('<div class="shh"></div><div class="sht">Configuracoes</div><div class="shs">Gerenciar dados</div><button class="btn bp" style="width:100%;margin-bottom:8px" data-act="exportexcel">'+I.download+'<span>Exportar Excel</span></button><button class="btn bs" style="width:100%;margin-bottom:8px" data-act="importexcel">'+I.upload+'<span>Importar Excel</span></button><div class="fa"><button class="btn bs" data-act="close">Fechar</button></div>')}
function exportExcel(){
if(typeof XLSX==="undefined"){toast("Biblioteca nao carregada");return}
var wb=XLSX.utils.book_new();
var sd=state.items.map(function(it){var c=gc(it.categoryId);return{Categoria:c?c.name:"",Item:it.name,Quantidade:it.qty,Unidade:it.unit||"un","Estoque Minimo":it.minQty||0,Localizacao:it.location||"","Observacoes":it.notes||"","Atualizado em":new Date(it.updated).toLocaleString("pt-BR")}});
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sd),"Estoque Atual");
var md=state.movements.map(function(m){var it=state.items.find(function(i){return i.id===m.itemId});return{Item:it?it.name:"(removido)",Tipo:m.type==="in"?"Entrada":"Saida",Quantidade:m.qty,Motivo:m.reason,Responsavel:m.user||"",Data:new Date(m.date).toLocaleString("pt-BR")}});
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(md),"Movimentacoes");
var cd=state.categories.map(function(c){return{Categoria:c.name,Icone:c.icon,Cor:c.color}});
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cd),"Categorias");
var ud=state.users.map(function(u){return{Usuario:u}});
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ud),"Usuarios");
XLSX.writeFile(wb,"estoque-pinhalense-"+new Date().toISOString().slice(0,10)+".xlsx");
toast("Excel exportado!");
}
function importExcel(file){
if(!file)return;
var reader=new FileReader();
reader.onload=function(e){
try{
var wb=XLSX.read(e.target.result,{type:"array"});
var wsC=wb.Sheets["Categorias"];
if(wsC){XLSX.utils.sheet_to_json(wsC).forEach(function(d){if(d.Categoria&&!state.categories.find(function(c){return c.name===d.Categoria})){state.categories.push({id:uid(),name:d.Categoria,icon:d.Icone||"box",color:d.Cor||CL[state.categories.length%CL.length]})}})}
var wsI=wb.Sheets["Estoque Atual"];
if(wsI){XLSX.utils.sheet_to_json(wsI).forEach(function(d){var cat=state.categories.find(function(c){return c.name===d.Categoria});if(cat){var ex=state.items.find(function(i){return i.name===d.Item&&i.categoryId===cat.id});if(ex){ex.qty=d.Quantidade;ex.unit=d.Unidade||"un";ex.minQty=d["Estoque Minimo"]||0;ex.location=d.Localizacao||"";ex.notes=d.Observacoes||"";ex.updated=Date.now()}else{state.items.push({id:uid(),name:d.Item,categoryId:cat.id,qty:d.Quantidade,unit:d.Unidade||"un",minQty:d["Estoque Minimo"]||0,location:d.Localizacao||"",notes:d.Observacoes||"",updated:Date.now()})}}})}
var wsM=wb.Sheets["Movimentacoes"];
if(wsM){XLSX.utils.sheet_to_json(wsM).forEach(function(d){var it=state.items.find(function(i){return i.name===d.Item});if(it){state.movements.push({id:uid(),itemId:it.id,type:d.Tipo==="Entrada"?"in":"out",qty:d.Quantidade,reason:d.Motivo||"",user:d.Responsavel||"",date:d.Data?new Date(d.Data).getTime():Date.now()})}})}
save();closeSheet();render();toast("Dados importados!");
}catch(err){toast("Erro: "+err.message)}
};
reader.readAsArrayBuffer(file);
}
function handleAction(e){
var el=e.target.closest("[data-act]");
if(!el)return;
var act=el.dataset.act,val=el.dataset.val,tp=el.dataset.type;
switch(act){
case"opencat":openCat(val);break;
case"openitem":openItemModal(val);break;
case"saveitem":saveItem();break;
case"deleteitem":deleteItem(val);break;
case"confirmdeleteitem":confirmDeleteItem(val);break;
case"openqty":openQtyModal(val,tp);break;
case"setq":setQ(parseInt(val));break;
case"confirmqty":confirmQty(val,tp);break;
case"showhistory":showHistory(val);break;
case"clearhistory":clearHistory(val);break;
case"close":closeSheet();break;
case"selicon":selIcon(val);break;
case"selcolor":selColor(val);break;
case"savecategory":saveCategory();break;
case"confirmdeletecategory":confirmDeleteCategory(val);break;
case"exportexcel":exportExcel();break;
case"importexcel":document.getElementById("fileInput").click();break;
case"openusers":cv="users";render();break;
case"adduser":addUser();break;
case"edituser":editUser(val);break;
case"confirmadduser":confirmAddUser();break;
case"confirmedituser":confirmEditUser(val);break;
case"deleteuser":deleteUser(val);break;
case"confirmdeleteuser":confirmDeleteUser(val);break;
case"openmovements":cv="movements";render();break;
case"opensettings":openSettings();break;
case"opencatmodal":openCategoryModal();break;
}
}
document.addEventListener("DOMContentLoaded",function(){
render();
document.getElementById("btnHome").addEventListener("click",goHome);
document.getElementById("overlay").addEventListener("click",closeSheet);
document.getElementById("fab").addEventListener("click",function(){openItemModal()});
document.getElementById("fileInput").addEventListener("change",function(e){importExcel(e.target.files[0])});
document.addEventListener("click",handleAction);
db.ref("estoque").on("value",function(s){
var d=s.val();
if(d&&d.categories&&d.items){
if(Date.now()-lastSave>1000){state=d;localStorage.setItem(SK,JSON.stringify(state));render()}
}else{
db.ref("estoque").set(state);
}
});
});
</script>
