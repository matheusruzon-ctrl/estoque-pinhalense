<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estoque Pinhalense</title>
  
  <!-- CDNs: Fonts, Firebase, SheetJS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --b: #6f1d46; --bd: #551636; --bl: #8a2558;<br/>
      --c: #54565a; --cd: #3a3b3d; --cl: #737680;<br/>
      --bg: #EDEEF0; --card: #fff; --br: #D8DADE;<br/>
      --tx: #2a2b2d; --ts: #737680; --in: #F5F6F8;<br/>
      --w: #C77B33; --wb: #FDF3E8;<br/>
      --d: #B33B30; --db: #FBEEEC;<br/>
      --o: #3D7A4E; --ob: #EAF5ED;<br/>
      --sh: 0 2px 8px rgba(84,86,90,.1);<br/>
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;<br/>
      margin: 0;<br/>
      padding: 0;<br/>
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #dcdde0;<br/>
      font-family: var(--font);<br/>
      color: var(--tx);<br/>
      display: flex;<br/>
      justify-content: center;<br/>
      align-items: flex-start;<br/>
      min-height: 100vh;
    }

    .app {
      width: 100%;<br/>
      max-width: 480px;<br/>
      min-height: 100vh;<br/>
      background-color: var(--bg);<br/>
      display: flex;<br/>
      flex-direction: column;<br/>
      position: relative;<br/>
      box-shadow: 0 0 24px rgba(0,0,0,0.15);<br/>
      padding-bottom: 90px;
    }

    /* Header */
    .hdr {
      background-color: var(--b);<br/>
      color: #fff;<br/>
      padding: 14px 16px;<br/>
      display: flex;<br/>
      justify-content: space-between;<br/>
      align-items: center;<br/>
      position: sticky;<br/>
      top: 0;<br/>
      z-index: 100;
    }

    .hdr-left {
      display: flex;<br/>
      align-items: center;<br/>
      gap: 10px;
    }

    .hdr-mark {
      background-color: #fff;<br/>
      color: var(--b);<br/>
      font-weight: 700;<br/>
      font-size: 18px;<br/>
      width: 32px;<br/>
      height: 32px;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      border-radius: 8px;
    }

    .hdr-title h1 {
      font-size: 16px;<br/>
      font-weight: 700;<br/>
      line-height: 1.1;<br/>
      letter-spacing: -0.01em;
    }

    .hdr-title .sub {
      font-size: 11px;<br/>
      opacity: 0.8;<br/>
      font-weight: 400;
    }

    .hr {
      display: flex;<br/>
      align-items: center;<br/>
      gap: 6px;<br/>
      position: relative;
    }

    .hb {
      background: rgba(255, 255, 255, 0.15);<br/>
      border: none;<br/>
      color: #fff;<br/>
      width: 32px;<br/>
      height: 32px;<br/>
      border-radius: 6px;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      cursor: pointer;
    }
    .hb svg { width: 16px; height: 16px; }

    /* User Button & Dropdown */
    .ub {
      background: rgba(255, 255, 255, 0.15);<br/>
      border: none;<br/>
      color: #fff;<br/>
      height: 32px;<br/>
      padding: 0 8px 0 4px;<br/>
      border-radius: 16px;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      gap: 6px;<br/>
      cursor: pointer;<br/>
      font-size: 12px;<br/>
      font-weight: 500;<br/>
      position: relative;
    }

    .ub-av {
      background: #fff;<br/>
      color: var(--b);<br/>
      width: 24px;<br/>
      height: 24px;<br/>
      border-radius: 50%;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      font-size: 10px;<br/>
      font-weight: 700;
    }

    .ub-arrow {
      font-size: 8px;<br/>
      opacity: 0.7;
    }

    .udd {
      display: none;<br/>
      position: absolute;<br/>
      top: 40px;<br/>
      right: 0;<br/>
      background: #fff;<br/>
      border-radius: 8px;<br/>
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);<br/>
      width: 200px;<br/>
      z-index: 1000;<br/>
      padding: 6px 0;<br/>
      border: 1px solid var(--br);
    }
    .udd.show { display: block; }

    .uddi {
      display: flex;<br/>
      align-items: center;<br/>
      gap: 8px;<br/>
      padding: 8px 12px;<br/>
      color: var(--tx);<br/>
      font-size: 13px;<br/>
      cursor: pointer;<br/>
      width: 100%;<br/>
      border: none;<br/>
      background: none;<br/>
      text-align: left;
    }
    .uddi:hover { background-color: var(--in); }<br/>
    .uddi.active { font-weight: 600; color: var(--b); }<br/>
    .uddi svg { width: 14px; height: 14px; margin-left: auto; }
    .udda {
      width: 22px;<br/>
      height: 22px;<br/>
      border-radius: 50%;<br/>
      color: #fff;<br/>
      font-size: 10px;<br/>
      font-weight: 700;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      flex-shrink: 0;
    }
    .uddd {
      height: 1px;<br/>
      background-color: var(--br);<br/>
      margin: 4px 0;
    }

    /* Network status */
    .sn {
      background-color: var(--cd);<br/>
      color: #fff;<br/>
      font-size: 11px;<br/>
      padding: 4px 12px;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      gap: 6px;<br/>
      justify-content: center;
    }
    .sn svg { width: 12px; height: 12px; }

    /* Top Navigation bar */
    .nav {
      background: #fff;<br/>
      display: flex;<br/>
      border-bottom: 1px solid var(--br);
    }

    .nvb {
      flex: 1;<br/>
      background: none;<br/>
      border: none;<br/>
      padding: 10px 4px;<br/>
      font-size: 12px;<br/>
      font-weight: 600;<br/>
      color: var(--ts);<br/>
      display: flex;<br/>
      flex-direction: column;<br/>
      align-items: center;<br/>
      gap: 4px;<br/>
      cursor: pointer;<br/>
      border-bottom: 2px solid transparent;
    }
    .nvb.active {
      color: var(--b);<br/>
      border-bottom-color: var(--b);
    }
    .nvb svg { width: 16px; height: 16px; }

    /* Search bar */
    .search-bar {
      padding: 10px 12px 0 12px;
    }
    .search-bar input {
      width: 100%;<br/>
      padding: 8px 12px;<br/>
      border: 1px solid var(--br);<br/>
      border-radius: 6px;<br/>
      font-size: 13px;<br/>
      background-color: #fff;<br/>
      outline: none;<br/>
      font-family: inherit;
    }
    .search-bar input:focus { border-color: var(--b); }

    /* Main Content */
    .content {
      padding: 12px;<br/>
      flex: 1;
    }
    .pg { display: none; }<br/>
    .pg.active { display: block; }

    /* Stats Grid */
    .sc {
      display: grid;<br/>
      grid-template-columns: repeat(2, 1fr);<br/>
      gap: 8px;<br/>
      margin-bottom: 16px;
    }
    .scc {
      background: #fff;<br/>
      padding: 12px;<br/>
      border-radius: 8px;<br/>
      box-shadow: var(--sh);<br/>
      display: flex;<br/>
      flex-direction: column;<br/>
      border: 1px solid var(--br);
    }
    .sci {
      width: 28px;<br/>
      height: 28px;<br/>
      border-radius: 6px;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      margin-bottom: 6px;
    }
    .sci svg { width: 16px; height: 16px; }<br/>
    .s1 .sci { background: #ECEFF1; color: var(--c); }<br/>
    .s2 .sci { background: var(--wb); color: var(--w); }<br/>
    .s3 .sci { background: var(--db); color: var(--d); }<br/>
    .s4 .sci { background: #EDE7F6; color: var(--b); }<br/>
    .scn { font-size: 20px; font-weight: 700; color: var(--tx); line-height: 1; }<br/>
    .scl { font-size: 11px; color: var(--ts); margin-top: 4px; font-weight: 500; }

    .dst {
      font-size: 13px;<br/>
      font-weight: 700;<br/>
      color: var(--c);<br/>
      text-transform: uppercase;<br/>
      letter-spacing: 0.05em;<br/>
      margin-bottom: 8px;
    }

    /* Category Cards in Dashboard */
    .dcc {
      background: #fff;<br/>
      border-radius: 8px;<br/>
      padding: 10px 12px;<br/>
      margin-bottom: 6px;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      gap: 12px;<br/>
      box-shadow: var(--sh);<br/>
      border: 1px solid var(--br);<br/>
      cursor: pointer;
    }
    .dci {
      width: 36px;<br/>
      height: 36px;<br/>
      border-radius: 6px;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      color: #fff;<br/>
      flex-shrink: 0;
    }
    .dci svg { width: 20px; height: 20px; }<br/>
    .dcn { font-size: 14px; font-weight: 600; color: var(--tx); flex: 1; }<br/>
    .dcm { font-size: 12px; color: var(--ts); }

    /* Item List & Item Card */
    .il { display: flex; flex-direction: column; gap: 8px; }
    .ic {
      background: #fff;<br/>
      border-radius: 8px;<br/>
      padding: 12px;<br/>
      box-shadow: var(--sh);<br/>
      border: 1px solid var(--br);<br/>
      display: flex;<br/>
      flex-direction: column;<br/>
      gap: 8px;<br/>
      position: relative;
    }
    .ic.low { border-left: 4px solid var(--w); }<br/>
    .ic.out { border-left: 4px solid var(--d); }<br/>
    .it { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }<br/>
    .inm { font-size: 14px; font-weight: 600; color: var(--tx); }
    
    .ib {
      font-size: 10px;<br/>
      font-weight: 600;<br/>
      padding: 2px 6px;<br/>
      border-radius: 4px;<br/>
      white-space: nowrap;
    }
    .ob-ok { background: var(--ob); color: var(--o); }<br/>
    .ob-w { background: var(--wb); color: var(--w); }<br/>
    .ob-d { background: var(--db); color: var(--d); }

    .ibm { display: flex; justify-content: space-between; align-items: baseline; }<br/>
    .iqn { font-size: 22px; font-weight: 700; color: var(--tx); }<br/>
    .iqu { font-size: 12px; color: var(--ts); margin-left: 2px; }<br/>
    .imt { font-size: 11px; color: var(--ts); }

    .ilc, .ius {
      display: flex;<br/>
      align-items: center;<br/>
      gap: 4px;<br/>
      font-size: 11px;<br/>
      color: var(--ts);
    }
    .ilc svg, .ius svg { width: 12px; height: 12px; }

    .ia {
      display: flex;<br/>
      gap: 6px;<br/>
      margin-top: 4px;<br/>
      padding-top: 8px;<br/>
      border-top: 1px solid var(--in);
    }
    .ab {
      flex: 1;<br/>
      border: none;<br/>
      padding: 6px 8px;<br/>
      border-radius: 4px;<br/>
      font-size: 12px;<br/>
      font-weight: 600;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      gap: 4px;<br/>
      cursor: pointer;
    }
    .ab svg { width: 14px; height: 14px; }<br/>
    .ain { background: var(--ob); color: var(--o); }<br/>
    .aout { background: var(--wb); color: var(--w); }<br/>
    .aedit { background: var(--in); color: var(--c); flex: 0 0 32px; padding: 0; }

    /* Movements List */
    .ml { display: flex; flex-direction: column; gap: 6px; }
    .mli {
      background: #fff;<br/>
      border-radius: 8px;<br/>
      padding: 10px;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      gap: 10px;<br/>
      border: 1px solid var(--br);<br/>
      box-shadow: var(--sh);
    }
    .mla {
      width: 28px;<br/>
      height: 28px;<br/>
      border-radius: 50%;<br/>
      color: #fff;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      flex-shrink: 0;
    }
    .mla svg { width: 14px; height: 14px; }<br/>
    .mlc { flex: 1; min-width: 0; }<br/>
    .mln { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }<br/>
    .mlm { font-size: 11px; color: var(--ts); margin-top: 2px; }<br/>
    .mld { font-size: 10px; color: var(--ts); text-align: right; white-space: nowrap; }

    /* Empty state */
    .es {
      text-align: center;<br/>
      padding: 40px 16px;<br/>
      color: var(--ts);
    }
    .es svg { width: 48px; height: 48px; margin-bottom: 8px; stroke-width: 1.5; }<br/>
    .es h3 { font-size: 16px; color: var(--tx); margin-bottom: 4px; }<br/>
    .es p { font-size: 12px; }

    /* Horizontal Category Tab Bar at Bottom */
    .tabbar {
      position: fixed;<br/>
      bottom: 0;<br/>
      width: 100%;<br/>
      max-width: 480px;<br/>
      background: #fff;<br/>
      display: flex;<br/>
      overflow-x: auto;<br/>
      border-top: 1px solid var(--br);<br/>
      z-index: 90;<br/>
      scrollbar-width: none;
    }
    .tabbar::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;<br/>
      padding: 8px 12px;<br/>
      background: none;<br/>
      border: none;<br/>
      display: flex;<br/>
      flex-direction: column;<br/>
      align-items: center;<br/>
      gap: 3px;<br/>
      font-size: 10px;<br/>
      color: var(--ts);<br/>
      cursor: pointer;<br/>
      min-width: 64px;
    }
    .tab.active { color: var(--b); font-weight: 600; }<br/>
    .tab.add { color: var(--c); border-left: 1px dashed var(--br); }<br/>
    .tab svg { width: 16px; height: 16px; }

    /* FAB */
    .fab {
      position: fixed;<br/>
      bottom: 64px;<br/>
      right: 16px;<br/>
      background: var(--b);<br/>
      color: #fff;<br/>
      border: none;<br/>
      width: 48px;<br/>
      height: 48px;<br/>
      border-radius: 50%;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      box-shadow: 0 4px 12px rgba(111,29,70,0.4);<br/>
      cursor: pointer;<br/>
      z-index: 95;
    }
    .fab svg { width: 24px; height: 24px; }

    /* Modal / Bottom Sheet */
    .ov {
      position: fixed;<br/>
      inset: 0;<br/>
      background: rgba(0,0,0,0.5);<br/>
      z-index: 200;<br/>
      display: none;
    }
    .ov.show { display: block; }
    .sh {
      position: fixed;<br/>
      left: 0;<br/>
      bottom: -100%;<br/>
      width: 100%;<br/>
      max-width: 480px;<br/>
      left: 50%;<br/>
      transform: translateX(-50%);<br/>
      background: #fff;<br/>
      border-radius: 16px 16px 0 0;<br/>
      padding: 16px;<br/>
      z-index: 201;<br/>
      max-height: 85vh;<br/>
      overflow-y: auto;<br/>
      transition: bottom 0.25s ease-out;
    }
    .sh.show { bottom: 0; }
    .shh {
      width: 36px;<br/>
      height: 4px;<br/>
      background: var(--br);<br/>
      border-radius: 2px;<br/>
      margin: 0 auto 12px auto;
    }
    .sht { font-size: 16px; font-weight: 700; color: var(--tx); }<br/>
    .shs { font-size: 12px; color: var(--ts); margin-bottom: 12px; }

    /* Form Controls */
    .fg { margin-bottom: 10px; }<br/>
    .fl { display: block; font-size: 11px; font-weight: 600; color: var(--c); margin-bottom: 4px; }
    .fi, .fs, .fta {
      width: 100%;<br/>
      padding: 8px 10px;<br/>
      border: 1px solid var(--br);<br/>
      border-radius: 6px;<br/>
      font-size: 13px;<br/>
      font-family: inherit;<br/>
      background: var(--in);<br/>
      outline: none;
    }
    .fi:focus, .fs:focus, .fta:focus { border-color: var(--b); background: #fff; }<br/>
    .fta { resize: vertical; min-height: 50px; }<br/>
    .fr { display: flex; gap: 8px; }<br/>
    .fr .fg { flex: 1; }

    /* Action Buttons */
    .fa { display: flex; gap: 8px; margin-top: 14px; }
    .btn {
      flex: 1;<br/>
      padding: 10px;<br/>
      border-radius: 6px;<br/>
      font-size: 13px;<br/>
      font-weight: 600;<br/>
      border: none;<br/>
      cursor: pointer;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      gap: 6px;
    }
    .btn svg { width: 14px; height: 14px; }<br/>
    .bp { background: var(--b); color: #fff; }<br/>
    .bs { background: var(--in); color: var(--tx); }<br/>
    .bd { background: var(--db); color: var(--d); }

    /* Quantity Picker */
    .qtt { display: flex; gap: 6px; margin-bottom: 12px; }
    .qtb {
      flex: 1;<br/>
      padding: 8px;<br/>
      border: 1px solid var(--br);<br/>
      background: #fff;<br/>
      border-radius: 6px;<br/>
      font-size: 12px;<br/>
      font-weight: 600;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      gap: 4px;<br/>
      cursor: pointer;
    }
    .qtb svg { width: 14px; height: 14px; }<br/>
    .qtb.in.active { background: var(--ob); color: var(--o); border-color: var(--o); }<br/>
    .qtb.out.active { background: var(--db); color: var(--d); border-color: var(--d); }<br/>
    .qc { font-size: 28px; font-weight: 700; color: var(--tx); }<br/>
    .qk { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 12px; }
    .qkb {
      background: var(--in);<br/>
      border: 1px solid var(--br);<br/>
      padding: 6px 0;<br/>
      border-radius: 4px;<br/>
      font-size: 12px;<br/>
      font-weight: 600;<br/>
      cursor: pointer;
    }

    /* Icon/Color Grids */
    .icg, .ccg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .icb {
      width: 32px;<br/>
      height: 32px;<br/>
      border: 1px solid var(--br);<br/>
      border-radius: 6px;<br/>
      background: #fff;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;<br/>
      cursor: pointer;<br/>
      color: var(--tx);
    }
    .icb svg { width: 16px; height: 16px; }<br/>
    .icb.active { border-color: var(--b); background: #fbebf2; color: var(--b); }
    .ccb {
      width: 24px;<br/>
      height: 24px;<br/>
      border-radius: 50%;<br/>
      border: 2px solid #fff;<br/>
      outline: 1px solid var(--br);<br/>
      cursor: pointer;
    }
    .ccb.active { outline: 2px solid var(--tx); }

    /* User Management item */
    .umi {
      display: flex;<br/>
      align-items: center;<br/>
      gap: 8px;<br/>
      padding: 8px 0;<br/>
      border-bottom: 1px solid var(--in);
    }
    .umia {
      width: 28px;<br/>
      height: 28px;<br/>
      border-radius: 50%;<br/>
      color: #fff;<br/>
      font-size: 11px;<br/>
      font-weight: 700;<br/>
      display: flex;<br/>
      align-items: center;<br/>
      justify-content: center;
    }
    .umin { font-size: 13px; font-weight: 500; flex: 1; }

    /* Toast */
    .tt {
      position: fixed;<br/>
      bottom: 60px;<br/>
      left: 50%;<br/>
      transform: translateX(-50%) translateY(50px);<br/>
      background: rgba(42,43,45,0.9);<br/>
      color: #fff;<br/>
      padding: 6px 14px;<br/>
      border-radius: 20px;<br/>
      font-size: 12px;<br/>
      pointer-events: none;<br/>
      opacity: 0;<br/>
      transition: all 0.2s ease;<br/>
      z-index: 300;<br/>
      white-space: nowrap;
    }
    .tt.show {
      opacity: 1;<br/>
      transform: translateX(-50%) translateY(0);
    }

    /* Footer */
    .aft {
      text-align: center;<br/>
      padding: 16px 8px;<br/>
      font-size: 11px;<br/>
      color: var(--ts);
    }
    .aft-name { font-weight: 700; color: var(--c); }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="hdr">
      <div class="hdr-left">
        <div class="hdr-mark">P</div>
        <div class="hdr-title">
          <h1>Pinhalense</h1>
          <div class="sub">Estoque Promocional</div>
        </div>
      </div>
      <div class="hr">
        <div class="ub" id="btnUser">
          <div class="ub-av" id="curUserAv">U</div>
          <span id="curUser">Selecionar</span>
          <div class="ub-arrow">▼</div>
          <div class="udd" id="userDD"></div>
        </div>
        <button class="hb" id="btnMov" title="Movimentações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><polyline points="12 7 12 12 15 14"/></svg>
        </button>

      else{document.getElementById("nm").classList.add("active");f.style.display="none";sb.style.display="none";renderMovements(el)}
    }

    function renderDashboard(el){
      var ti=state.items,ni=ti.length,low=ti.filter(function(i){return st(i)==="low"}).length,out=ti.filter(function(i){return st(i)==="out"}).length,nc=state.categories.length;
      var h='<div class="pg active"><div class="sc"><div class="scc s1"><div class="sci">'+I.box+'</div><div class="scn">'+ni+'</div><div class="scl">Itens em estoque</div></div><div class="scc s2"><div class="sci">'+I.arrowDown+'</div><div class="scn">'+low+'</div><div class="scl">Estoque baixo</div></div><div class="scc s3"><div class="sci">'+I.x+'</div><div class="scn">'+out+'</div><div class="scl">Sem estoque</div></div><div class="scc s4"><div class="sci">'+I.tag+'</div><div class="scn">'+nc+'</div><div class="scl">Categorias</div></div></div><div class="dst">Categorias</div>';
      state.categories.forEach(function(c){
        var items=ibc(c.id),t=items.reduce(function(s,i){return s+i.qty},0),l=items.filter(function(i){return st(i)==="low"||st(i)==="out"}).length;
        h+='<div class="dcc" data-act="switchtab" data-val="'+c.id+'"><div class="dci" style="background:'+c.color+'">'+(I[c.icon]||I.box)+'</div><div class="dcn">'+c.name+'</div><div class="dcm">'+items.length+' tipos - '+t+' un'+(l>0?' - '+l+' alertas':"")+'</div></div>';
      });
      el.innerHTML=h+'</div>';
    }

    function renderStock(el){
      var cat=gc(ct);
      if(!cat){el.innerHTML="";return}
      var s=(document.getElementById("searchInput")&&document.getElementById("searchInput").value||"").toLowerCase();
      var items=ibc(ct);
      if(s)items=items.filter(function(i){return i.name.toLowerCase().indexOf(s)>=0||(i.notes||"").toLowerCase().indexOf(s)>=0});
      if(items.length===0){
        el.innerHTML='<div class="pg active"><div class="es">'+(I[cat.icon]||I.box)+'<h3>'+(s?"Nenhum resultado":"Nenhum item")+'</h3><p>'+(s?"Tente outro termo":"Toque no + para adicionar")+'</p></div></div>';
        return;
      }
      items.sort(function(a,b){return b.updated-a.updated});
      var h='<div class="pg active"><div class="il">';
      items.forEach(function(it){
        var sts=st(it),cc=sts==="out"?" out":sts==="low"?" low":"",bc=sts==="out"?"ob-d":sts==="low"?"ob-w":"ob-ok",bt=sts==="out"?"Sem estoque":sts==="low"?"Estoque baixo":"Em estoque";
        var lm=state.movements.filter(function(m){return m.itemId===it.id}).sort(function(a,b){return b.date-a.date})[0];
        var ut=lm?'<div class="ius">'+I.user+'<span>Ultima mov: '+(lm.user||"-")+'</span></div>':"";<br/>
        h+='<div class="ic'+cc+'" data-act="openitem" data-val="'+it.id+'"><div class="it"><div class="inm">'+it.name+'</div><span class="ib '+bc+'">'+bt+'</span></div><div class="ibm"><div><span class="iqn">'+it.qty+'</span><span class="iqu">'+(it.unit||"un")+'</span></div><div class="imt">Atualizado '+fd(it.updated)+'</div></div>'+(it.location?'<div class="ilc">'+I.pin+'<span>'+it.location+'</span></div>':"")+ut+'<div class="ia"><button class="ab ain" data-act="openqty" data-val="'+it.id+'" data-type="in">'+I.arrowUp+'Entrar</button><button class="ab aout" data-act="openqty" data-val="'+it.id+'" data-type="out">'+I.arrowDown+'Sair</button><button class="ab aedit" data-act="openitem" data-val="'+it.id+'">'+I.pencil+'</button></div></div>';
      });
      el.innerHTML=h+'</div></div>';
    }

    function renderMovements(el){
      var movs=state.movements.slice().sort(function(a,b){return b.date-a.date});
      if(movs.length===0){
        el.innerHTML='<div class="pg active"><div class="es">'+I.history+'<h3>Sem movimentacoes</h3><p>As entradas e saidas aparecerao aqui</p></div></div>';
        return;
      }
      var h='<div class="pg active"><div class="ml">';
      movs.forEach(function(m){
        var it=state.items.find(function(i){return i.id===m.itemId});
        var isIn=m.type==="in";
        h+='<div class="mli"><div class="mla" style="background:'+(isIn?"var(--o)":"var(--d)")+'">'+(isIn?I.arrowUp:I.arrowDown)+'</div><div class="mlc"><div class="mln">'+(it?it.name:"(removido)")+'</div><div class="mlm">'+(isIn?"+":"-")+m.qty+' '+(it?it.unit||"un":"un")+' - '+m.reason+' - '+m.user+'</div><div class="mld">'+fd(m.date)+'</div></div></div>';
      });
      el.innerHTML=h+'</div></div>';
    }

    // Item Management
    function openItemModal(id){
      eii=id||null;
      var it=id?state.items.find(function(i){return i.id===id}):null;<br/>
      var defCat=it?it.categoryId:(ct==="dashboard"?state.categories[0].id:ct);<br/>
      var cats=state.categories.map(function(c){return'<option value="'+c.id+'"'+(defCat===c.id?" selected":"")+">"+c.name+"</option>"}).join("");<br/>
      showSheet('<div class="shh"></div><div class="sht">'+(it?"Editar Item":"Novo Item")+'</div><div class="shs">'+(it?"Ajuste as informacoes":"Preencha os dados do novo item")+'</div><div class="fg"><label class="fl">Nome *</label><input type="text" class="fi" id="fn" value="'+(it?it.name:"")+'" placeholder="Ex: Catalogo Geral 2025"></div><div class="fr"><div class="fg"><label class="fl">Categoria</label><select class="fs" id="fc">'+cats+'</select></div><div class="fg"><label class="fl">Unidade</label><input type="text" class="fi" id="fu" value="'+(it?it.unit||"un":"un")+'" placeholder="un, cx"></div></div><div class="fr"><div class="fg"><label class="fl">Quantidade *</label><input type="number" class="fi" id="fq" value="'+(it?it.qty:0)+'" min="0"></div><div class="fg"><label class="fl">Minimo</label><input type="number" class="fi" id="fm" value="'+(it?it.minQty||0:0)+'" min="0"></div></div><div class="fg"><label class="fl">Local</label><input type="text" class="fi" id="fl" value="'+(it?it.location||"":"")+'" placeholder="Armario A"></div><div class="fg"><label class="fl">Observacoes</label><textarea class="fta" id="fo" placeholder="Notas...">'+(it?it.notes||"":"")+'</textarea></div>'+(it?'<button class="btn bs" style="width:100%;margin-bottom:8px" data-act="showhistory" data-val="'+it.id+'">'+I.history+'<span> Historico</span></button>':"")+'<div class="fa">'+(it?'<button class="btn bd" data-act="deleteitem" data-val="'+it.id+'">'+I.trash+'</button>':"")+'<button class="btn bs" data-act="close">Cancelar</button><button class="btn bp" data-act="saveitem">'+(it?"Salvar":"Adicionar")+'</button></div>');
    }

    function saveItem(){
      var n=document.getElementById("fn").value.trim();
      if(!n){toast("Informe o nome");return}
      var d={name:n,categoryId:document.getElementById("fc").value,unit:document.getElementById("fu").value.trim()||"un",qty:parseInt(document.getElementById("fq").value)||0,minQty:parseInt(document.getElementById("fm").value)||0,location:document.getElementById("fl").value.trim(),notes:document.getElementById("fo").value.trim(),updated:Date.now()};
      if(eii){Object.assign(state.items.find(function(i){return i.id===eii}),d);toast("Item atualizado")}
      else{d.id=uid();state.items.push(d);if(d.qty>0)state.movements.push({id:uid(),itemId:d.id,type:"in",qty:d.qty,reason:"Cadastro inicial",user:state.currentUser||"Sistema",date:Date.now()});toast("Item adicionado")}
      save();closeSheet();renderContent();
    }

    function deleteItem(id){showSheet('<div class="shh"></div><div class="sht">Excluir Item</div><div class="shs">Tem certeza?</div><div class="fa"><button class="btn bs" data-act="close">Cancelar</button><button class="btn bd" style="flex:1" data-act="confirmdeleteitem" data-val="'+id+'">Excluir</button></div>')}
    
    function confirmDeleteItem(id){state.items=state.items.filter(function(i){return i.id!==id});state.movements=state.movements.filter(function(m){return m.itemId!==id});save();closeSheet();renderContent();toast("Item excluido")}

    // Quantity Adjustments
    function openQtyModal(id,type){
      if(!ruser())return;
      var it=state.items.find(function(i){return i.id===id});
      if(!it)return;
      var tl=type==="in"?"Entrada":"Saida";<br/>
      showSheet('<div class="shh"></div><div class="sht">'+tl+' de Material</div><div class="shs">'+it.name+' - Saldo: '+it.qty+' '+(it.unit||"un")+'</div><div class="qtt"><button class="qtb in'+(type==="in"?" active":"")+'" data-act="openqty" data-val="'+id+'" data-type="in">'+I.arrowUp+'Entrada</button><button class="qtb out'+(type==="out"?" active":"")+'" data-act="openqty" data-val="'+id+'" data-type="out">'+I.arrowDown+'Saida</button></div><div style="text-align:center;margin-bottom:10px"><div class="qc" id="qcDisp">1</div></div><div class="qk"><button class="qkb" data-act="setq" data-val="1">1</button><button class="qkb" data-act="setq" data-val="2">2</button><button class="qkb" data-act="setq" data-val="5">5</button><button class="qkb" data-act="setq" data-val="10">10</button><button class="qkb" data-act="setq" data-val="20">20</button><button class="qkb" data-act="setq" data-val="50">50</button></div><div class="fg"><label class="fl">Quantidade</label><input type="number" class="fi" id="qc" value="1" min="1" oninput="document.getElementById(\'qcDisp\').textContent=this.value"></div><div class="fg"><label class="fl">Motivo</label><input type="text" class="fi" id="qr" placeholder="'+(type==="in"?"Ex: Compra, Doacao":"Ex: Uso, Perda")+'"></div><div class="fa"><button class="btn bs" data-act="close">Cancelar</button><button class="btn bp" data-act="confirmqty" data-val="'+id+'" data-type="'+type+'">Confirmar</button></div>');
    }

    function setQ(q){if(document.getElementById("qc"))document.getElementById("qc").value=q;if(document.getElementById("qcDisp"))document.getElementById("qcDisp").textContent=q}

    function confirmQty(id,type){
      var q=parseInt(document.getElementById("qc").value)||0;
      if(q<=0){toast("Quantidade invalida");return}
      var it=state.items.find(function(i){return i.id===id});
      if(!it)return;
      var r=document.getElementById("qr").value.trim()||(type==="in"?"Entrada manual":"Saida manual");
      if(type==="out"&&q>it.qty){toast("Quantidade superior ao estoque");return}
      it.qty+=type==="in"?q:-q;
      it.updated=Date.now();
      state.movements.push({id:uid(),itemId:id,type:type,qty:q,reason:r,user:state.currentUser,date:Date.now()});
      save();closeSheet();renderContent();
      toast((type==="in"?"+":"-")+q+" "+(it.unit||"un")+" - "+it.name);
    }

    // Item History
    function showHistory(id){
      var it=state.items.find(function(i){return i.id===id});
      if(!it)return;
      var movs=state.movements.filter(function(m){return m.itemId===id}).sort(function(a,b){return b.date-a.date});
      var h='<div class="shh"></div><div class="sht">Historico</div><div class="shs">'+it.name+'</div>';
      if(movs.length===0){h+='<div class="es">'+I.history+'<h3>Sem movimentacoes</h3></div>'}
      else{
        h+='<div class="ml">';
        movs.forEach(function(m){
          var isIn=m.type==="in";
          h+='<div class="mli"><div class="mla" style="background:'+(isIn?"var(--o)":"var(--d)")+'">'+(isIn?I.arrowUp:I.arrowDown)+'</div><div class="mlc"><div class="mln">'+(isIn?"+":"-")+m.qty+' '+(it.unit||"un")+'</div><div class="mlm">'+m.reason+' - '+m.user+'</div><div class="mld">'+fd(m.date)+'</div></div></div>';
        });
        h+='</div>';
      }
      h+='<div class="fa"><button class="btn bs" data-act="close">Fechar</button>'+(movs.length>0?'<button class="btn bd" data-act="clearhistory" data-val="'+id+'">Limpar</button>':"")+'</div>';
      showSheet(h);
    }

    function clearHistory(id){state.movements=state.movements.filter(function(m){return m.itemId!==id});save();closeSheet();toast("Historico limpo")}

    // Category Management
    function openCategoryModal(){
      eci=null;
      showSheet('<div class="shh"></div><div class="sht">Nova Categoria</div><div class="shs">Crie uma categoria</div><div class="fg"><label class="fl">Nome *</label><input type="text" class="fi" id="cn" placeholder="Ex: Canetas"></div><div class="fg"><label class="fl">Icone</label><div class="icg" id="iconGrid">'+IK.map(function(k,i){return'<button class="icb'+(i===0?" active":"")+'" data-act="selicon" data-val="'+k+'">'+(I[k]||I.box)+'</button>'}).join("")+'</div></div><div class="fg"><label class="fl">Cor</label><div class="ccg" id="colorGrid">'+CL.map(function(c,i){return'<button class="ccb'+(i===0?" active":"")+'" style="background:'+c+'" data-act="selcolor" data-val="'+c+'"></button>'}).join("")+'</div></div><div class="fa"><button class="btn bs" data-act="close">Cancelar</button><button class="btn bp" data-act="savecategory">Criar</button></div>');
      ti=IK[0];tc=CL[0];
    }

    function selIcon(v){
      ti=v;
      var bs=document.querySelectorAll("#iconGrid .icb");
      bs.forEach(function(b){b.classList.toggle("active",b.dataset.val===v)});
    }

    function selColor(v){
      tc=v;
      var bs=document.querySelectorAll("#colorGrid .ccb");
      bs.forEach(function(b){b.classList.toggle("active",b.dataset.val===v)});
    }

    function saveCategory(){
      var n=document.getElementById("cn").value.trim();
      if(!n){toast("Informe o nome");return}
      state.categories.push({id:uid(),name:n,icon:ti,color:tc});
      save();closeSheet();render();toast("Categoria criada");
    }

    function deleteCategory(id){showSheet('<div class="shh"></div><div class="sht">Excluir Categoria</div><div class="shs">Itens serao removidos tambem</div><div class="fa"><button class="btn bs" data-act="close">Cancelar</button><button class="btn bd" style="flex:1" data-act="confirmdeletecategory" data-val="'+id+'">Excluir</button></div>')}

    function confirmDeleteCategory(id){
      state.categories=state.categories.filter(function(c){return c.id!==id});
      state.items=state.items.filter(function(i){return i.categoryId!==id});
      save();closeSheet();render();toast("Categoria excluida");
    }

    // Settings & Excel I/O
    function openSettings(){
      showSheet('<div class="shh"></div><div class="sht">Configuracoes</div><div class="shs">Gerenciar dados do sistema</div><button class="btn bp" style="width:100%;margin-bottom:8px" data-act="exportexcel">'+I.download+'<span>Exportar para Excel</span></button><button class="btn bs" style="width:100%;margin-bottom:8px" data-act="importexcel">'+I.upload+'<span>Importar do Excel</span></button><input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none"><div class="fa"><button class="btn bs" data-act="close">Fechar</button></div>');
    }

    function exportExcel(){
      if(typeof XLSX==="undefined"){toast("Biblioteca nao carregada");return}
      var wb=XLSX.utils.book_new();
      var sd=state.items.map(function(it){var c=gc(it.categoryId);return{Categoria:c?c.name:"",Item:it.name,Quantidade:it.qty,Unidade:it.unit||"un","Estoque Minimo":it.minQty||0,Localizacao:it.location||"","Observacoes":it.notes||"","Atualizado em":new Date(it.updated).toLocaleString("pt-BR")}});
      var ws1=XLSX.utils.json_to_sheet(sd);
      XLSX.utils.book_append_sheet(wb,ws1,"Estoque Atual");
      var md=state.movements.map(function(m){var it=state.items.find(function(i){return i.id===m.itemId});return{Item:it?it.name:"(removido)",Tipo:m.type==="in"?"Entrada":"Saida",Quantidade:m.qty,Motivo:m.reason,Responsavel:m.user||"",Data:new Date(m.date).toLocaleString("pt-BR")}});
      var ws2=XLSX.utils.json_to_sheet(md);
      XLSX.utils.book_append_sheet(wb,ws2,"Movimentacoes");
      var cd=state.categories.map(function(c){return{Categoria:c.name,Icone:c.icon,Cor:c.color}});
      var ws3=XLSX.utils.json_to_sheet(cd);
      XLSX.utils.book_append_sheet(wb,ws3,"Categorias");
      var ud=state.users.map(function(u){return{Usuario:u}});
      var ws4=XLSX.utils.json_to_sheet(ud);
      XLSX.utils.book_append_sheet(wb,ws4,"Usuarios");
      XLSX.writeFile(wb,"estoque-pinhalense-"+new Date().toISOString().slice(0,10)+".xlsx");
      toast("Excel exportado!");
    }

    function importExcel(file){
      if(!file)return;
      var reader=new FileReader();
      reader.onload=function(e){
        try{
          var wb=XLSX.read(e.target.result,{type:"array"});
          var wsC=wb.Sheets["Categorias"];
          if(wsC){XLSX.utils.sheet_to_json(wsC).forEach(function(d){if(d.Categoria&&!state.categories.find(function(c){return c.name===d.Categoria})){state.categories.push({id:uid(),name:d.Categoria,icon:d.Icone||"box",color:d.Cor||CL[state.categories.length%CL.length]})}})}
          var wsI=wb.Sheets["Estoque Atual"];
          if(wsI){XLSX.utils.sheet_to_json(wsI).forEach(function(d){var cat=state.categories.find(function(c){return c.name===d.Categoria});if(cat){var ex=state.items.find(function(i){return i.name===d.Item&&i.categoryId===cat.id});if(ex){ex.qty=d.Quantidade;ex.unit=d.Unidade||"un";ex.minQty=d["Estoque Minimo"]||0;ex.location=d.Localizacao||"";ex.notes=d.Observacoes||"";ex.updated=Date.now()}else{state.items.push({id:uid(),name:d.Item,categoryId:cat.id,qty:d.Quantidade,unit:d.Unidade||"un",minQty:d["Estoque Minimo"]||0,location:d.Localizacao||"",notes:d.Observacoes||"",updated:Date.now()})}}})}
          var wsM=wb.Sheets["Movimentacoes"];
          if(wsM){XLSX.utils.sheet_to_json(wsM).forEach(function(d){var it=state.items.find(function(i){return i.name===d.Item});if(it){state.movements.push({id:uid(),itemId:it.id,type:d.Tipo==="Entrada"?"in":"out",qty:d.Quantidade,reason:d.Motivo||"",user:d.Responsavel||"",date:d.Data?new Date(d.Data).getTime():Date.now()})}})}
          save();closeSheet();render();toast("Dados importados!");
        }catch(err){toast("Erro: "+err.message)}
      };
      reader.readAsArrayBuffer(file);
    }

    // Action Router / Event Delegation
    function handleAction(e){
      var el=e.target.closest("[data-act]");
      if(!el)return;
      var act=el.dataset.act,val=el.dataset.val,tp=el.dataset.type;
      switch(act){
        case"seluser":selectUser(val);break;<br/>
        case"adduser":addUser();break;<br/>
        case"manageusers":manageUsers();break;<br/>
        case"edituser":editUser(val);break;<br/>
        case"confirmadduser":confirmAddUser();break;<br/>
        case"confirmedituser":confirmEditUser(val);break;<br/>
        case"deleteuser":deleteUser(val);break;<br/>
        case"confirmdeleteuser":confirmDeleteUser(val);break;<br/>
        case"switchtab":switchTab(val);break;<br/>
        case"opencatmodal":openCategoryModal();break;<br/>
        case"openitem":openItemModal(val);break;<br/>
        case"saveitem":saveItem();break;<br/>
        case"deleteitem":deleteItem(val);break;<br/>
        case"confirmdeleteitem":confirmDeleteItem(val);break;<br/>
        case"openqty":openQtyModal(val,tp);break;<br/>
        case"setq":setQ(parseInt(val));break;<br/>
        case"confirmqty":confirmQty(val,tp);break;<br/>
        case"showhistory":showHistory(val);break;<br/>
        case"clearhistory":clearHistory(val);break;<br/>
        case"close":closeSheet();break;<br/>
        case"selicon":selIcon(val);break;<br/>
        case"selcolor":selColor(val);break;<br/>
        case"savecategory":saveCategory();break;<br/>
        case"deletecategory":deleteCategory(val);break;<br/>
        case"confirmdeletecategory":confirmDeleteCategory(val);break;<br/>
        case"exportexcel":exportExcel();break;<br/>
        case"importexcel":document.getElementById("fileInput").click();break;
      }
    }

    // DOM Ready Setup
    document.addEventListener("DOMContentLoaded",function(){
      render();
      document.getElementById("overlay").addEventListener("click",closeSheet);
      document.getElementById("btnUser").addEventListener("click",function(e){e.stopPropagation();renderUserDropdown();document.getElementById("userDD").classList.toggle("show")});
      document.getElementById("btnMov").addEventListener("click",function(){switchView("movements")});
      document.getElementById("btnSet").addEventListener("click",openSettings);
      document.getElementById("nd").addEventListener("click",function(){switchView("dashboard")});
      document.getElementById("ns").addEventListener("click",function(){switchView("stock")});
      document.getElementById("nm").addEventListener("click",function(){switchView("movements")});
      document.getElementById("fab").addEventListener("click",function(){openItemModal()});
      document.getElementById("searchInput").addEventListener("input",renderContent);
      document.getElementById("fileInput").addEventListener("change",function(e){importExcel(e.target.files[0])});
      
      document.addEventListener("click",function(e){
        if(!e.target.closest(".ub")&&!e.target.closest(".udd"))document.getElementById("userDD").classList.remove("show");
        handleAction(e);
      });

      // Firebase Realtime Synchronization
      db.ref("estoque").on("value",function(s){
        var d=s.val();
        if(d&&d.categories&&d.items){
          if(Date.now()-lastSave>1000){state=d;localStorage.setItem(SK,JSON.stringify(state));render()}
        }else{
          db.ref("estoque").set(state);
        }
      });
    });
  </script>
</body>
</html>
