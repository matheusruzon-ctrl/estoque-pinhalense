<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--b:#6f1d46;--bd:#551636;--bl:#8a2558;--c:#54565a;--cd:#3a3b3d;--cl:#737680;--bg:#EDEEF0;--card:#fff;--br:#D8DADE;--tx:#2a2b2d;--ts:#737680;--in:#F5F6F8;--w:#C77B33;--wb:#FDF3E8;--d:#B33B30;--db:#FBEEEC;--o:#3D7A4E;--ob:#EAF5ED;--sh:0 2px 8px rgba(84,86,90,.1)}
body{font-family:'Effra','Helvetica Neue',sans-serif;background:#222;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow-x:hidden;box-shadow:0 0 40px rgba(0,0,0,.3)}
.hdr{background:linear-gradient(135deg,var(--bd),var(--b));padding:10px 14px;position:sticky;top:0;z-index:100;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.hdr-mark{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Effra',sans-serif;font-size:22px;font-weight:700;color:var(--b);letter-spacing:-1px}
.hdr-title h1{font-size:17px;font-weight:700;line-height:1;color:#fff}
.hdr-title .sub{font-size:9px;opacity:.75;margin-top:2px;letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.hr{display:flex;gap:5px;align-items:center}
.hb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.08);color:#fff;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.hb:active{transform:scale(.9)}.hb svg{width:16px;height:16px}
.ub{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.08);color:#fff;padding:6px 10px;border-radius:9px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;max-width:120px;overflow:hidden}
.ub svg{width:13px;height:13px;flex-shrink:0}.ub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.udd{position:absolute;top:42px;right:0;background:var(--card);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:300;min-width:210px;display:none;max-height:320px;overflow-y:auto}
.udd.show{display:block}
.uddi{padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;border:none;background:none;font-family:inherit;width:100%;text-align:left;color:var(--tx);font-size:12px}
.uddi:active{background:var(--in)}.uddi.active{background:#F5E8EF;color:var(--b);font-weight:600}.uddi svg{width:15px;height:15px;flex-shrink:0}
.udda{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.uddd{height:1px;background:var(--br);margin:4px 0}
.umi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--br)}.umi:last-child{border-bottom:none}
.umia{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.umin{flex:1;font-size:13px;font-weight:600;color:var(--tx)}
.umb{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--ts)}.umb:active{background:var(--in)}.umb svg{width:15px;height:15px}.umb.del{color:var(--d)}
.obn{background:var(--cd);color:rgba(255,255,255,.7);padding:4px 16px;font-size:9px;text-align:center;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px}
.obn svg{width:10px;height:10px}
.sn{display:flex;background:var(--c);position:sticky;top:60px;z-index:99;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.snb{flex:1;padding:10px 6px;background:none;border:none;color:rgba(255,255,255,.5);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:4px}
.snb svg{width:14px;height:14px}.snb.active{color:#fff;border-bottom-color:var(--bl)}
.sb{padding:10px 14px 4px;background:var(--bg);display:none}.sw{position:relative}
.si{width:100%;padding:10px 12px 10px 38px;border:1.5px solid var(--br);border-radius:12px;font-family:inherit;font-size:14px;background:var(--card);color:var(--tx);outline:none}.si:focus{border-color:var(--c)}
.sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ts);pointer-events:none}
.ct{flex:1;overflow-y:auto;padding:0 14px 100px}
.dt{font-size:16px;font-weight:700;margin:14px 0 10px;color:var(--tx)}
.dss{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.scc{background:var(--card);border-radius:12px;padding:12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.scc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}.scc.s1::before{background:var(--b)}.scc.s2::before{background:var(--w)}.scc.s3::before{background:var(--d)}.scc.s4::before{background:var(--c)}
.scn{font-size:22px;font-weight:700;color:var(--tx)}.scl{font-size:9px;color:var(--ts);margin-top:3px;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.sci{position:absolute;right:8px;top:8px;opacity:.08;width:28px;height:28px}.sci svg{width:28px;height:28px}
.dst{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--tx)}
.dcc{background:var(--card);border-radius:10px;padding:10px 12px;box-shadow:var(--sh);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.dcc:active{transform:scale(.98)}
.dcl{display:flex;align-items:center;gap:10px}.dci{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.dci svg{width:17px;height:17px}
.dcn{font-weight:600;font-size:12px;color:var(--tx)}.dcm{font-size:10px;color:var(--ts);margin-top:2px}.dccp{font-size:17px;font-weight:700}
.ic{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;border:1.5px solid transparent}.ic:active{transform:scale(.98)}.ic.low{border-color:var(--w)}.ic.out{border-color:var(--d);opacity:.9}
.it{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.inm{font-weight:600;font-size:13px;color:var(--tx);flex:1}
.ib{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-left:6px}
.bok{background:var(--ob);color:var(--o)}.blow{background:var(--wb);color:var(--w)}.bout{background:var(--db);color:var(--d)}
.ibm{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.iqn{font-size:20px;font-weight:700;color:var(--tx)}.iqu{font-size:11px;color:var(--ts)}.imt{font-size:9px;color:var(--ts)}
.ilc{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--ts);margin-top:3px}.ilc svg{width:11px;height:11px;flex-shrink:0}
.ius{font-size:9px;color:var(--ts);margin-top:2px;display:flex;align-items:center;gap:3px}.ius svg{width:10px;height:10px;flex-shrink:0}
.ia{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--br)}
.ab{flex:1;padding:7px 8px;border-radius:9px;border:none;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}.ab svg{width:14px;height:14px}.ab:active{transform:scale(.95)}
.ain{background:var(--ob);color:var(--o)}.aout{background:var(--wb);color:var(--w)}.aedit{background:var(--in);color:var(--c);flex:0 0 auto;width:38px;padding:7px}
.es{text-align:center;padding:46px 20px;color:var(--ts)}.es svg{width:50px;height:50px;opacity:.25;margin-bottom:10px}.es h3{font-size:13px;margin-bottom:4px;color:var(--tx)}.es p{font-size:11px}
.fab{position:fixed;right:16px;bottom:78px;z-index:90;width:50px;height:50px;border-radius:14px;background:var(--b);color:#fff;border:none;box-shadow:0 4px 16px rgba(111,29,70,.4);display:none;align-items:center;justify-content:center;cursor:pointer}
@media(min-width:481px){.fab{right:calc(50% - 240px + 16px)}}.fab:active{transform:scale(.88)}.fab svg{width:24px;height:24px}
.tbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--cd);display:flex;align-items:center;padding:5px 4px;padding-bottom:calc(5px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.15);z-index:100;overflow-x:auto;scrollbar-width:none}.tbar::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;padding:6px 5px;border:none;background:none;cursor:pointer;font-family:inherit;border-radius:9px;gap:2px}.tab:active{transform:scale(.92)}
.tab svg{width:20px;height:20px;color:rgba(255,255,255,.45)}.tab span{font-size:9px;color:rgba(255,255,255,.45);white-space:nowrap;font-weight:500}
.tab.active svg{color:#fff}.tab.active span{color:#fff;font-weight:700}.tab.active{background:rgba(255,255,255,.06)}
.tab.add svg{color:var(--bl)}.tab.add span{color:var(--bl)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;visibility:hidden;transition:.3s}.ov.show{opacity:1;visibility:visible}
.sh{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));z-index:201;transition:.35s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto}
.sh.show{transform:translate(-50%,0)}
.shh{width:38px;height:4px;background:var(--br);border-radius:4px;margin:0 auto 12px}
.sht{font-size:17px;font-weight:700;margin-bottom:2px;color:var(--tx)}.shs{font-size:11px;color:var(--ts);margin-bottom:14px}
.fg{margin-bottom:12px}.fl{display:block;font-size:10px;font-weight:600;color:var(--ts);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.fi,.fs,.fta{width:100%;padding:10px 12px;border:1.5px solid var(--br);border-radius:10px;font-family:inherit;font-size:14px;color:var(--tx);background:var(--in);outline:none}.fi:focus,.fs:focus,.fta:focus{border-color:var(--c);background:#fff}.fta{resize:vertical;min-height:50px}
.fr{display:flex;gap:8px}.fr .fg{flex:1}.fa{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}.btn:active{transform:scale(.97)}
.bp{background:var(--b);color:#fff}.bp:active{background:var(--bd)}.bs{background:var(--in);color:var(--c)}.bd{background:var(--db);color:var(--d);flex:0 0 auto;width:44px}
.ig{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
.io{aspect-ratio:1;border-radius:9px;border:2px solid var(--br);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--in)}.io.sel{border-color:var(--b);background:#F5E8EF}.io svg{width:18px;height:18px;color:var(--c)}.io.sel svg{color:var(--b)}
.cg{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.co{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}.co.sel{border-color:#fff;box-shadow:0 0 0 2px var(--b)}
.qd{font-size:38px;font-weight:700;color:var(--tx);margin:10px 0;line-height:1}
.qtt{display:flex;background:var(--in);border-radius:10px;padding:3px;margin-bottom:12px}
.qtb{flex:1;padding:8px;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;background:none;color:var(--ts);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}.qtb svg{width:14px;height:14px}.qtb.active{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.08)}.qtb.in.active{color:var(--o)}.qtb.out.active{color:var(--w)}
.qq{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.qc{padding:6px 13px;border-radius:18px;border:1.5px solid var(--br);background:var(--card);font-family:inherit;font-size:12px;font-weight:600;color:var(--tx);cursor:pointer}.qc:active{transform:scale(.92)}
.qbi{width:100%;padding:12px;font-size:26px;font-weight:700;text-align:center;border:2px solid var(--br);border-radius:12px;font-family:inherit;color:var(--tx);background:var(--in);outline:none;margin-bottom:10px}.qbi:focus{border-color:var(--b);background:#fff}
.hi{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--br)}.hi:last-child{border-bottom:none}
.hd{width:8px;height:8px;border-radius:50%;flex-shrink:0}.hd.in{background:var(--o)}.hd.out{background:var(--w)}
.ht{font-size:11px;font-weight:500;color:var(--tx)}.hd2{font-size:9px;color:var(--ts)}.hq{font-size:13px;font-weight:700}.hq.in{color:var(--o)}.hq.out{color:var(--w)}
.mc{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.mi{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center}.mi.in{background:var(--ob)}.mi.out{background:var(--wb)}.mi svg{width:16px;height:16px}.mi.in svg{color:var(--o)}.mi.out svg{color:var(--w)}
.mnm{font-weight:600;font-size:12px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mmt{font-size:10px;color:var(--ts);margin-top:2px}
.mq{font-size:15px;font-weight:700}.mq.in{color:var(--o)}.mq.out{color:var(--w)}
.tt{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--cd);color:#fff;padding:9px 18px;border-radius:22px;font-size:12px;z-index:300;opacity:0;visibility:hidden;transition:.3s;white-space:nowrap}.tt.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.fiw{position:relative;overflow:hidden}.fif{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;left:0;top:0}
.aft{background:var(--cd);padding:16px 20px;text-align:center}
.aft-name{font-size:18px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:-.5px;margin-bottom:4px}
.aftt{font-size:9px;color:rgba(255,255,255,.3);margin-top:4px}
.pg{display:none}.pg.active{display:block}
</style>
</head>

function fd(ts){var d=new Date(ts),n=Date.now(),df=Math.floor((n-ts)/86400000);if(df===0)return'Hoje';if(df===1)return'Ontem';if(df<7)return df+' dias atras';return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})}

function renderUserDropdown(){var dd=document.getElementById('userDD'),h='';state.users.forEach(function(u,i){var a=u===state.currentUser;h+='<div class="uddi'+(a?' active':'')+'" onclick="selectUser(\''+u.replace(/'/g,"\'")+'\')"><div class="udda" style="background:'+UC[i%UC.length]+'">'+ui2(u)+'</div><span>'+u+'</span>'+(a?I.check:'')+'</div>'});h+='<div class="uddd"></div><button class="uddi" onclick="addUser()">'+I.plus+'<span>Adicionar usuario</span></button><button class="uddi" onclick="manageUsers()">'+I.users+'<span>Gerenciar usuarios</span></button>';dd.innerHTML=h}
function selectUser(n){state.currentUser=n;save();document.getElementById('curUser').textContent=n.split(' ')[0];document.getElementById('userDD').classList.remove('show');toast('Usuario: '+n)}
function addUser(){showSheet('<div class="shh"></div><div class="sht">Novo Usuario</div><div class="shs">Adicione um membro da equipe</div><div class="fg"><label class="fl">Nome completo *</label><input type="text" class="fi" id="nun" placeholder="Ex: Carlos Pereira"></div><div class="fa"><button class="btn bs" onclick="closeSheet()">Cancelar</button><button class="btn bp" onclick="confirmAddUser()">Adicionar</button></div>')}
function confirmAddUser(){var n=document.getElementById('nun').value.trim();if(!n){toast('Informe o nome');return}if(!state.users.includes(n))state.users.push(n);selectUser(n);closeSheet();renderUserDropdown()}
function manageUsers(){var h='<div class="shh"></div><div class="sht">Gerenciar Usuarios</div><div class="shs">Editar ou excluir usuarios</div>';state.users.forEach(function(u,i){h+='<div class="umi"><div class="umia" style="background:'+UC[i%UC.length]+'">'+ui2(u)+'</div><div class="umin">'+u+(u===state.currentUser?' <span style="font-size:9px;color:var(--b);font-weight:700">ATIVO</span>':'')+'</div><button class="umb" onclick="editUser(\''+u.replace(/'/g,"\'")+'\')">'+I.pencil+'</button><button class="umb del" onclick="deleteUser(\''+u.replace(/'/g,"\'")+'\')">'+I.trash+'</button></div>'});h+='<div class="fa"><button class="btn bs" onclick="closeSheet()">Fechar</button><button class="btn bp" onclick="closeSheet();addUser()">'+I.plus+'Adicionar</button></div>';showSheet(h)}
function editUser(name){showSheet('<div class="shh"></div><div class="sht">Editar Usuario</div><div class="shs">Alterar o nome do usuario</div><div class="fg"><label class="fl">Nome</label><input type="text" class="fi" id="eun" value="'+name.replace(/"/g,'&quot;')+'"></div><div class="fa"><button class="btn bs" onclick="closeSheet();manageUsers()">Voltar</button><button class="btn bp" onclick="confirmEditUser(\''+name.replace(/'/g,"\'")+'\')">Salvar</button></div>')}
function confirmEditUser(oldName){var n=document.getElementById('eun').value.trim();if(!n){toast('Informe o nome');return}var i=state.users.indexOf(oldName);if(i>=0)state.users[i]=n;if(state.currentUser===oldName)state.currentUser=n;state.movements.forEach(function(m){if(m.user===oldName)m.user=n});save();closeSheet();manageUsers();renderUserDropdown();toast('Usuario atualizado')}
function deleteUser(name){if(state.users.length<=1){toast('Nao pode excluir o unico usuario');return}showSheet('<div class="shh"></div><div class="sht">Excluir Usuario</div><div class="shs">Excluir "'+name+'"? O historico sera mantido.</div><div class="fa"><button class="btn bs" onclick="closeSheet();manageUsers()">Cancelar</button><button class="btn bd" style="flex:1" onclick="confirmDeleteUser(\''+name.replace(/'/g,"\'")+'\')">Excluir</button></div>')}
function confirmDeleteUser(name){var i=state.users.indexOf(name);if(i>=0)state.users.splice(i,1);if(state.currentUser===name)state.currentUser='';save();closeSheet();manageUsers();renderUserDropdown();toast('Usuario excluido')}

function renderTabBar(){var b=document.getElementById('tabBar'),h='<button class="tab'+(ct==='dashboard'?' active':'')+'" onclick="switchTab(\'dashboard\')">'+I.home+'<span>Inicio</span></button>';state.categories.forEach(function(c){h+='<button class="tab'+(ct===c.id?' active':'')+'" onclick="switchTab(\''+c.id+'\')"><span style="color:'+(ct===c.id?c.color:'')+'">'+(I[c.icon]||I.box)+'</span><span style="'+(ct===c.id?'color:'+c.color+';font-weight:700':'')+'">'+c.name+'</span></button>'});h+='<button class="tab add" onclick="openCategoryModal()">'+I.plus+'<span>Nova</span></button>';b.innerHTML=h;setTimeout(function(){var a=b.querySelector('.tab.active');if(a)a.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})},50)}

function renderDashboard(el){var tot=state.items.reduce(function(s,i){return s+i.qty},0),low=state.items.filter(function(i){return st(i)==='low'}).length,out=state.items.filter(function(i){return st(i)==='out'}).length,nc=state.categories.length;var h='<div class="pg active"><div class="dt">Visao Geral</div><div class="dss"><div class="scc s1"><div class="sci">'+I.box+'</div><div class="scn">'+tot.toLocaleString('pt-BR')+'</div><div class="scl">Itens em estoque</div></div><div class="scc s2"><div class="sci">'+I.alert+'</div><div class="scn">'+low+'</div><div class="scl">Estoque baixo</div></div><div class="scc s3"><div class="sci">'+I.alert+'</div><div class="scn">'+out+'</div><div class="scl">Sem estoque</div></div><div class="scc s4"><div class="sci">'+I.tag+'</div><div class="scn">'+nc+'</div><div class="scl">Categorias</div></div></div><div class="dst">Categorias</div>';state.categories.forEach(function(c){var items=ibc(c.id),t=items.reduce(function(s,i){return s+i.qty},0),l=items.filter(function(i){return st(i)==='low'}).length,o=items.filter(function(i){return st(i)==='out'}).length;var m=items.length+' tipos - '+t+' un';if(l>0||o>0)m+=' - '+(l+o)+' alertas';h+='<div class="dcc" onclick="switchTab(\''+c.id+'\')"><div class="dcl"><div class="dci" style="background:'+c.color+'15;color:'+c.color+'">'+(I[c.icon]||I.box)+'</div><div><div class="dcn">'+c.name+'</div><div class="dcm">'+m+'</div></div></div><div class="dccp" style="color:'+c.color+'">'+t+'</div></div>'});el.innerHTML=h+'</div>'}
function renderStock(el){var cat=gc(ct);if(!cat){el.innerHTML='';return}var s=(document.getElementById('searchInput')&&document.getElementById('searchInput').value||'').toLowerCase();var items=ibc(ct);if(s)items=items.filter(function(i){return i.name.toLowerCase().indexOf(s)>=0||(i.notes||'').toLowerCase().indexOf(s)>=0});if(items.length===0){el.innerHTML='<div class="pg active"><div class="es">'+(I[cat.icon]||I.box)+'<h3>'+(s?'Nenhum resultado':'Nenhum item')+'</h3><p>'+(s?'Tente outro termo':'Toque no + para adicionar')+'</p></div></div>';return}items.sort(function(a,b){var oa={out:0,low:1,ok:2};if(oa[st(a)]!==oa[st(b)])return oa[st(a)]-oa[st(b)];return a.name.localeCompare(b.name)});var h='<div class="pg active">';items.forEach(function(it){var s2=st(it),bc=s2==='ok'?'bok':s2==='low'?'blow':'bout',bt=s2==='ok'?'Em estoque':s2==='low'?'Baixo':'Sem estoque',cc=s2==='low'?'low':s2==='out'?'out':'';var lm=state.movements.filter(function(m){return m.itemId===it.id}).sort(function(a,b){return b.date-a.date})[0];var ut=lm?'<div class="ius">'+I.user+'<span>Ultima mov: '+(lm.user||'-')+'</span></div>':'';h+='<div class="ic '+cc+'" onclick="openItemModal(\''+it.id+'\')"><div class="it"><div class="inm">'+it.name+'</div><span class="ib '+bc+'">'+bt+'</span></div><div class="ibm"><div><span class="iqn">'+it.qty+'</span><span class="iqu">'+(it.unit||'un')+'</span></div><div class="imt">Atualizado '+fd(it.updated)+'</div></div>'+(it.location?'<div class="ilc">'+I.pin+'<span>'+it.location+'</span></div>':'')+ut+'<div class="ia" onclick="event.stopPropagation()"><button class="ab ain" onclick="openQtyModal(\''+it.id+'\',\'in\')">'+I.arrowUp+'Entrar</button><button class="ab aout" onclick="openQtyModal(\''+it.id+'\',\'out\')">'+I.arrowDown+'Sair</button><button class="ab aedit" onclick="openItemModal(\''+it.id+'\')">'+I.pencil+'</button></div></div>'});el.innerHTML=h+'</div>'}
function renderMovements(el){var movs=state.movements.sort(function(a,b){return b.date-a.date}).slice(0,100);var h='<div class="pg active"><div class="dt">Movimentacoes</div>';if(movs.length===0){el.innerHTML=h+'<div class="es">'+I.history+'<h3>Nenhuma movimentacao</h3><p>As entradas e saidas aparecerao aqui</p></div></div>';return}movs.forEach(function(m){var it=state.items.find(function(i){return i.id===m.itemId});var nm=it?it.name:'(removido)';h+='<div class="mc"><div class="mi '+(m.type==='in'?'in':'out')+'">'+(m.type==='in'?I.arrowUp:I.arrowDown)+'</div><div style="flex:1;min-width:0"><div class="mnm">'+nm+'</div><div class="mmt">'+m.reason+' - '+(m.user||'-')+' - '+new Date(m.date).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</div></div><div class="mq '+(m.type==='in'?'in':'out')+'">'+(m.type==='in'?'+':'-')+m.qty+'</div></div>'});el.innerHTML=h+'</div>'}
function switchView(v){cv=v;if(v==='dashboard')ct='dashboard';else if(v==='stock'&&ct==='dashboard'&&state.categories.length>0)ct=state.categories[0].id;render()}
function switchTab(t){cv='stock';ct=t;if(document.getElementById('searchInput'))document.getElementById('searchInput').value='';render()}
function openItemModal(id){eii=id||null;var it=id?state.items.find(function(i){return i.id===id}):null;var cats=state.categories.map(function(c){return'<option value="'+c.id+'"'+(it&&it.categoryId===c.id?' selected':'')+'>'+c.name+'</option>'}).join('');showSheet('<div class="shh"></div><div class="sht">'+(it?'Editar Item':'Novo Item')+'</div><div class="shs">'+(it?'Ajuste as informacoes':'Preencha os dados do novo item')+'</div><div class="fg"><label class="fl">Nome *</label><input type="text" class="fi" id="fn" value="'+(it?it.name.replace(/"/g,'&quot;'):'')+'" placeholder="Ex: Catalogo Geral 2025"></div><div class="fr"><div class="fg"><label class="fl">Categoria</label><select class="fs" id="fc">'+cats+'</select></div><div class="fg"><label class="fl">Unidade</label><input type="text" class="fi" id="fu" value="'+(it?it.unit||'un':'un')+'" placeholder="un, cx"></div></div><div class="fr"><div class="fg"><label class="fl">Quantidade *</label><input type="number" class="fi" id="fq" value="'+(it?it.qty:0)+'" min="0"></div><div class="fg"><label class="fl">Minimo</label><input type="number" class="fi" id="fm" value="'+(it?it.minQty||0:0)+'" min="0"></div></div><div class="fg"><label class="fl">Local</label><input type="text" class="fi" id="fl" value="'+(it?(it.location||'').replace(/"/g,'&quot;'):'')+'" placeholder="Armario A"></div><div class="fg"><label class="fl">Observacoes</label><textarea class="fta" id="fo" placeholder="Notas...">'+(it?(it.notes||''):'')+'</textarea></div>'+(it?'<button class="btn bs" style="width:100%;margin-bottom:8px" onclick="showHistory(\''+it.id+'\')">'+I.history+'<span> Historico</span></button>':'')+'<div class="fa">'+(it?'<button class="btn bd" onclick="deleteItem(\''+it.id+'\')">'+I.trash+'</button>':'')+'<button class="btn bs" onclick="closeSheet()">Cancelar</button><button class="btn bp" onclick="saveItem()">'+(it?'Salvar':'Adicionar')+'</button></div>')}
function saveItem(){var n=document.getElementById('fn').value.trim();if(!n){toast('Informe o nome');return}var d={name:n,categoryId:document.getElementById('fc').value,unit:document.getElementById('fu').value.trim()||'un',qty:parseInt(document.getElementById('fq').value)||0,minQty:parseInt(document.getElementById('fm').value)||0,location:document.getElementById('fl').value.trim(),notes:document.getElementById('fo').value.trim(),updated:Date.now()};if(eii){Object.assign(state.items.find(function(i){return i.id===eii}),d);toast('Item atualizado')}else{d.id=uid();state.items.push(d);if(d.qty>0)state.movements.push({id:uid(),itemId:d.id,type:'in',qty:d.qty,reason:'Cadastro inicial',user:state.currentUser,date:Date.now()});toast('Item adicionado')}save();closeSheet();renderContent()}
function deleteItem(id){var it=state.items.find(function(i){return i.id===id});if(!it)return;showSheet('<div class="shh"></div><div class="sht">Excluir Item</div><div class="shs">Acao irreversivel</div><p style="font-size:13px;color:var(--ts);margin-bottom:12px">Excluir <strong>"'+it.name+'"</strong>?</p><div class="fa"><button class="btn bs" onclick="closeSheet()">Cancelar</button><button class="btn bd" style="flex:1" onclick="confirmDeleteItem(\''+id+'\')">Excluir</button></div>')}
function confirmDeleteItem(id){state.items=state.items.filter(function(i){return i.id!==id});state.movements=state.movements.filter(function(m){return m.itemId!==id});save();closeSheet();renderContent();toast('Item excluido')}
function openQtyModal(id,type){if(!ruser())return;var it=state.items.find(function(i){return i.id===id});if(!it)return;var tl=type==='in'?'Entrada':'Saida',tcol=type==='in'?'var(--o)':'var(--w)';showSheet('<div class="shh"></div><div class="sht">'+tl+' de Material</div><div class="shs">'+it.name+' - Saldo: '+it.qty+' '+(it.unit||'un')+'</div><div class="qtt"><button class="qtb in'+(type==='in'?' active':'')+'" onclick="openQtyModal(\''+id+'\',\'in\')">'+I.arrowUp+'Entrada</button><button class="qtb out'+(type==='out'?' active':'')+'" onclick="openQtyModal(\''+id+'\',\'out\')">'+I.arrowDown+'Saida</button></div><div style="text-align:center;margin-bottom:10px"><div class="qd" id="qds">0</div><div style="font-size:13px;color:var(--ts)">'+(it.unit||'un')+'</div></div><div class="qq"><button class="qc" onclick="setQ(5)">5</button><button class="qc" onclick="setQ(10)">10</button><button class="qc" onclick="setQ(25)">25</button><button class="qc" onclick="setQ(50)">50</button><button class="qc" onclick="setQ(100)">100</button><button class="qc" onclick="setQ(500)">500</button></div><div class="fg"><label class="fl">Quantidade</label><input type="number" class="qbi" id="qc" value="0" min="0" oninput="document.getElementById(\'qds\').textContent=this.value||0" placeholder="0"></div><div class="fg"><label class="fl">Motivo</label><input type="text" class="fi" id="qr" placeholder="'+(type==='in'?'Compra, Doacao':'Distribuicao, Evento')+'"></div><div class="fg"><label class="fl">Responsavel</label><input type="text" class="fi" id="qu" value="'+state.currentUser+'" readonly style="font-weight:600"></div><div class="fa"><button class="btn bs" onclick="closeSheet()">Cancelar</button><button class="btn bp" style="background:'+tcol+'" onclick="confirmQty(\''+id+'\',\''+type+'\')">Confirmar '+tl+'</button></div>')}
function setQ(v){document.getElementById('qc').value=v;document.getElementById('qds').textContent=v}
function confirmQty(id,type){var q=parseInt(document.getElementById('qc').value)||0;if(q<=0){toast('Quantidade invalida');return}var it=state.items.find(function(i){return i.id===id});if(!it)return;var r=document.getElementById('qr').value.trim()||(type==='in'?'Entrada manual':'Saida manual');if(type==='out'&&q>it.qty){toast('Quantidade superior ao estoque');return}it.qty+=type==='in'?q:-q;it.updated=Date.now();state.movements.push({id:uid(),itemId:id,type:type,qty:q,reason:r,user:state.currentUser,date:Date.now()});save();closeSheet();renderContent();toast((type==='in'?'+':'-')+q+' '+(it.unit||'un')+' - '+it.name)}
function showHistory(id){var it=state.items.find(function(i){return i.id===id});if(!it)return;var movs=state.movements.filter(function(m){return m.itemId===id}).sort(function(a,b){return b.date-a.date});var h='<div class="shh"></div><div class="sht">Historico - '+it.name+'</div><div class="shs">'+movs.length+' movimentacao(oes)</div>';if(movs.length===0){h+='<div style="text-align:center;padding:20px;color:var(--ts)">'+I.history+'<p style="margin-top:6px;font-size:12px">Nenhuma movimentacao</p></div>'}else{movs.forEach(function(m){h+='<div class="hi"><div class="hd '+m.type+'"></div><div style="flex:1"><div class="ht">'+m.reason+'</div><div class="hd2">Por '+(m.user||'-')+' - '+new Date(m.date).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</div></div><div class="hq '+m.type+'">'+(m.type==='in'?'+':'-')+m.qty+'</div></div>'})}h+='</div><div class="fa"><button class="btn bs" onclick="closeSheet()">Fechar</button><button class="btn bs" style="background:var(--db);color:var(--d)" onclick="clearHistory(\''+id+'\')">Limpar</button></div>';showSheet(h)}
function clearHistory(id){state.movements=state.movements.filter(function(m){return m.itemId!==id});save();closeSheet();toast('Historico limpo')}
function openCategoryModal(id){eci=id||null;var cat=id?gc(id):null;ti=cat?cat.icon:'box';tc=cat?cat.color:CL[0];var ih=IK.map(function(k){return'<div class="io'+(ti===k?' sel':'')+'" onclick="selIcon(\''+k+'\')" data-i="'+k+'">'+(I[k]||I.box)+'</div>'}).join('');var ch=CL.map(function(c){return'<div class="co'+(tc===c?' sel':'')+'" style="background:'+c+'" onclick="selColor(\''+c+'\')" data-c="'+c+'"></div>'}).join('');showSheet('<div class="shh"></div><div class="sht">'+(cat?'Editar Categoria':'Nova Categoria')+'</div><div class="shs">'+(cat?'Ajuste nome, icone ou cor':'Crie uma nova categoria')+'</div><div class="fg"><label class="fl">Nome *</label><input type="text" class="fi" id="cna" value="'+(cat?cat.name:'')+'" placeholder="Ex: Canetas"></div><div class="fg"><label class="fl">Icone</label><div class="ig">'+ih+'</div></div><div class="fg"><label class="fl">Cor</label><div class="cg">'+ch+'</div></div><div class="fa">'+(cat?'<button class="btn bd" onclick="deleteCategory(\''+cat.id+'\')">'+I.trash+'</button>':'')+'<button class="btn bs" onclick="closeSheet()">Cancelar</button><button class="btn bp" onclick="saveCategory()">'+(cat?'Salvar':'Criar')+'</button></div>')}
function selIcon(k){ti=k;document.querySelectorAll('.io').forEach(function(e){e.classList.toggle('sel',e.dataset.i===k)})}
function selColor(c){tc=c;document.querySelectorAll('.co').forEach(function(e){e.classList.toggle('sel',e.dataset.c===c)})}
function saveCategory(){var n=document.getElementById('cna').value.trim();if(!n){toast('Informe o nome');return}var d={name:n,icon:ti,color:tc};if(eci){Object.assign(gc(eci),d);toast('Categoria atualizada')}else{d.id=uid();state.categories.push(d);ct=d.id;cv='stock';toast('Categoria criada')}save();closeSheet();render()}
function deleteCategory(id){var items=ibc(id);var m=items.length>0?'Esta categoria contem '+items.length+' item(ns).':'Excluir esta categoria?';showSheet('<div class="shh"></div><div class="sht">Excluir Categoria</div><div class="shs">'+m+'</div><div class="fa"><button class="btn bs" onclick="closeSheet()">Cancelar</button><button class="btn bd" style="flex:1" onclick="confirmDeleteCategory(\''+id+'\')">Excluir</button></div>')}
function confirmDeleteCategory(id){state.items=state.items.filter(function(i){return i.categoryId!==id});state.categories=state.categories.filter(function(c){return c.id!==id});state.movements=state.movements.filter(function(m){return state.items.find(function(i){return i.id===m.itemId})});if(ct===id){ct='dashboard';cv='dashboard'}save();closeSheet();render();toast('Categoria excluida')}
function openSettings(){showSheet('<div class="shh"></div><div class="sht">Configuracoes</div><div class="shs">Backup e restauracao de dados</div><div style="background:var(--cd);border-radius:14px;padding:14px;margin-bottom:12px"><div style="color:rgba(255,255,255,.6);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">'+I.settings+'<span style="margin-left:6px">Dados</span></div><button style="width:100%;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px" onclick="exportExcel()">'+I.download+'Exportar para Excel</button><div class="fiw"><button style="width:100%;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px" onclick="this.nextElementSibling.click()">'+I.upload+'Importar do Excel</button><input type="file" class="fif" accept=".xlsx,.xls,.csv" onchange="importExcel(event)"></div><div style="font-size:10px;color:rgba(255,255,255,.4);margin-top:8px;text-align:center">Use para backup ou migracao de dados</div></div><div class="fa"><button class="btn bs" onclick="closeSheet()">Fechar</button></div>')}
function exportExcel(){if(typeof XLSX==='undefined'){toast('Biblioteca nao carregada');return}var wb=XLSX.utils.book_new();var sd=state.items.map(function(it){var c=gc(it.categoryId);return{Categoria:c?c.name:'',Item:it.name,Quantidade:it.qty,Unidade:it.unit||'un','Estoque Minimo':it.minQty||0,Localizacao:it.location||'','Observacoes':it.notes||'','Atualizado em':new Date(it.updated).toLocaleString('pt-BR')}});var ws1=XLSX.utils.json_to_sheet(sd);XLSX.utils.book_append_sheet(wb,ws1,'Estoque Atual');var md=state.movements.map(function(m){var it=state.items.find(function(i){return i.id===m.itemId});return{Item:it?it.name:'(removido)',Tipo:m.type==='in'?'Entrada':'Saida',Quantidade:m.qty,Motivo:m.reason,Responsavel:m.user||'',Data:new Date(m.date).toLocaleString('pt-BR')}});var ws2=XLSX.utils.json_to_sheet(md);XLSX.utils.book_append_sheet(wb,ws2,'Movimentacoes');var cd=state.categories.map(function(c){return{Categoria:c.name,Icone:c.icon,Cor:c.color}});var ws3=XLSX.utils.json_to_sheet(cd);XLSX.utils.book_append_sheet(wb,ws3,'Categorias');var ud=state.users.map(function(u){return{Usuario:u}});var ws4=XLSX.utils.json_to_sheet(ud);XLSX.utils.book_append_sheet(wb,ws4,'Usuarios');XLSX.writeFile(wb,'estoque-pinhalense-'+new Date().toISOString().slice(0,10)+'.xlsx');toast('Excel exportado!')}
function importExcel(event){var file=event.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){try{var wb=XLSX.read(e.target.result,{type:'array'});var wsC=wb.Sheets['Categorias'];if(wsC){XLSX.utils.sheet_to_json(wsC).forEach(function(d){if(d.Categoria&&!state.categories.find(function(c){return c.name===d.Categoria}))state.categories.push({id:uid(),name:d.Categoria,icon:d.Icone||'box',color:d.Cor||'#54565a'})})}var wsU=wb.Sheets['Usuarios'];if(wsU){XLSX.utils.sheet_to_json(wsU).forEach(function(d){if(d.Usuario&&!state.users.includes(d.Usuario))state.users.push(d.Usuario)})}var wsI=wb.Sheets['Estoque Atual'];if(wsI){XLSX.utils.sheet_to_json(wsI).forEach(function(d){var cat=state.categories.find(function(c){return c.name===d.Categoria});if(cat){var ex=state.items.find(function(i){return i.name===d.Item&&i.categoryId===cat.id});if(ex){ex.qty=d.Quantidade;ex.unit=d.Unidade||'un';ex.minQty=d['Estoque Minimo']||0;ex.location=d.Localizacao||'';ex.notes=d.Observacoes||'';ex.updated=Date.now()}else{state.items.push({id:uid(),name:d.Item,categoryId:cat.id,qty:d.Quantidade,unit:d.Unidade||'un',minQty:d['Estoque Minimo']||0,location:d.Localizacao||'',notes:d.Observacoes||'',updated:Date.now()})}}})}var wsM=wb.Sheets['Movimentacoes'];if(wsM){XLSX.utils.sheet_to_json(wsM).forEach(function(d){var it=state.items.find(function(i){return i.name===d.Item});if(it){state.movements.push({id:uid(),itemId:it.id,type:d.Tipo==='Entrada'?'in':'out',qty:d.Quantidade,reason:d.Motivo||'',user:d.Responsavel||'',date:d.Data?new Date(d.Data).getTime():Date.now()})}})}save();closeSheet();render();toast('Dados importados!')}catch(err){toast('Erro: '+err.message)}};reader.readAsArrayBuffer(file)}
function showSheet(html){var o=document.getElementById('overlay'),s=document.getElementById('sheet');s.innerHTML=html;o.classList.add('show');requestAnimationFrame(function(){s.classList.add('show')})}
function closeSheet(){var o=document.getElementById('overlay'),s=document.getElementById('sheet');s.classList.remove('show');o.classList.remove('show');eii=null;eci=null}
document.addEventListener('DOMContentLoaded',function(){render();document.getElementById('overlay').addEventListener('click',closeSheet);document.addEventListener('click',function(e){if(!e.target.closest('.ub')&&!e.target.closest('.udd'))document.getElementById('userDD').classList.remove('show')});db.ref('estoque').on('value',function(s){var d=s.val();if(d&&d.categories&&d.items){if(Date.now()-lastSave>1000){state=d;localStorage.setItem(SK,JSON.stringify(state));render()}}else{db.ref('estoque').set(state)}})});
</script>
</body>
